<div class="p-4  designOne">
    <div class=" d-flex justify-content-center">
        <input class="form-control" multiple type="file" name="fileUpload" (change)="fileUpload($event)"
            accept=".pdf,.png,image/png">
    </div>
    <div class="row mt-3 p-3">
        <table style="width: 100%;">
            <thead style="background-color: aquamarine;">
                <th>S.NO</th>
                <th>FIle Name</th>
                <th>Uploaded By</th>
                <th>Uploaded Date</th>
                <th>File Type</th>
                <th>Action</th>
            </thead>
            <tbody>
                <tr *ngFor="let fileData of fileList;let i = index">
                    <td>{{i+1}}</td>
                    <td>{{fileData.fileName}}</td>
                    <td>{{fileData.uploadedBy}}</td>
                    <td>{{fileData.uploadedDate}}</td>
                    <td>{{fileData.fileType}}</td>
                    <td>
                        <a href="javascript:void(0)" title="view" style="font-size: x-large;color: dimgrey;"
                            (click)="downloadFile(fileData,true)"><i class="fa fa-eye" aria-hidden="true"></i></a>
                        <a href="javascript:void(0)" title="Download" style="font-size: x-large;color: dimgrey;"
                            (click)="downloadFile(fileData,false)"><i class=" ml-3 fa fa-download"
                                aria-hidden="true"></i></a>
                        <a href="javascript:void(0)" title="Delete" style="font-size: x-large; color: dimgrey;"
                            (click)="deleteFile(fileData)" class="ml-3 text-danger"><i class="fa fa-trash"
                                aria-hidden="true"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<ng-template #viewDocument>
    <div class="modal-header">
        <h4 class="modal-title pull-left">View Document</h4>
        <button type="button" class="close pull-right" aria-label="Close" (click)="modalRef.hide()">
            <span aria-hidden="true">×</span>
        </button>
    </div>
    <div class="modal-body d-flex justify-content-center">
        @if(fileDetails.fileType == 'application/pdf'){
        <iframe [src]="fileDetails.filePath |safeUrl" width="400" height="400"></iframe>
        }
        @else{
        <img [src]="fileDetails.filePath |safeUrl" alt="NOt Found" width="400" height="300">
        }
    </div>
    <div class="modal-footer">
        <button class="btn btn-light" type="button" (click)="modalRef.hide()">Close</button>
    </div>
</ng-template>
