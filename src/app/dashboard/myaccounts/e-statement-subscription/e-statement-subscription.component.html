<div class="p-4 row d-flex justify-content-center designOne">
  <div style="width: 80%;">
    <canvas baseChart [chartType]="'bar'" [legend]="true" [datasets]="chartData" [labels]="chartLabels"
      [options]="chartOptions" (chartHover)="onChartHover($event)" (chartClick)="onChartClick($event)">
    </canvas>
    <div class="d-flex justify-content-center ">
      <button class="btn btn-primary btn-sm"
        (click)="getChartDetails(currentUserDetails.userAccountId,dataType)">{{dataType==1? "Change to Customer" : "Change to Fund"}}</button>
    </div>
  </div>

</div>
