<section class="feature-page">
    <header>
        <div>
            <h2>Reports</h2>
            <p>Filter operational and financial data, then export it as CSV.</p>
        </div>
        <button mat-flat-button color="primary" [disabled]="loading" (click)="download()"><mat-icon>download</mat-icon>
            Download CSV</button>
    </header>
    <mat-card><mat-card-content>
            <form [formGroup]="form" class="filters" (ngSubmit)="run()">
                <mat-form-field appearance="outline"><mat-label>Report</mat-label><mat-select
                        formControlName="reportType"><mat-optgroup *ngFor="let group of reportGroups"
                            [label]="group.label"><mat-option *ngFor="let item of group.items"
                                [value]="item.value">{{item.label}}</mat-option></mat-optgroup></mat-select></mat-form-field>
                <mat-form-field appearance="outline"><mat-label>From</mat-label><input matInput type="date"
                        formControlName="from"></mat-form-field>
                <mat-form-field appearance="outline"><mat-label>To</mat-label><input matInput type="date"
                        formControlName="to"></mat-form-field>
                <mat-form-field appearance="outline"><mat-label>Customer ID</mat-label><input matInput type="number"
                        formControlName="customerId"></mat-form-field>
                <mat-form-field appearance="outline"><mat-label>Loan type</mat-label><mat-select
                        formControlName="loanType"><mat-option value="">All</mat-option><mat-option
                            value="DAILY">Daily</mat-option><mat-option value="WEEKLY">Weekly</mat-option><mat-option
                            value="MONTHLY">Monthly</mat-option></mat-select></mat-form-field>
                <mat-form-field appearance="outline"><mat-label>Chit ID</mat-label><input matInput type="number"
                        formControlName="chitId"></mat-form-field>
                <mat-form-field appearance="outline"><mat-label>Collector ID</mat-label><input matInput type="number"
                        formControlName="collectorId"></mat-form-field>
                <mat-form-field appearance="outline"><mat-label>Status</mat-label><input matInput
                        formControlName="status"></mat-form-field>
                <div><button mat-flat-button color="primary" type="submit" [disabled]="loading">Run
                        report</button><button mat-button type="button" (click)="reset()">Clear</button></div>
            </form>
        </mat-card-content></mat-card>
    <mat-card class="results"><mat-card-content>
            <div class="loading" *ngIf="loading"><mat-spinner diameter="34"></mat-spinner></div>
            <div class="table-wrap" *ngIf="result && !loading">
                <table mat-table [dataSource]="result.rows">
                    <ng-container *ngFor="let column of result.columns" [matColumnDef]="column">
                        <th mat-header-cell *matHeaderCellDef>{{heading(column)}}</th>
                        <td mat-cell *matCellDef="let row">{{row[column]}}</td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="result.columns"></tr>
                    <tr mat-row *matRowDef="let row;columns:result.columns"></tr>
                </table>
                <p>{{result.totalRows | number}} row(s)</p>
            </div>
            <p class="empty" *ngIf="!result && !loading">Select filters and run a report.</p>
        </mat-card-content></mat-card>
</section>
